services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-baroon_reptile}
      DB_USER: ${DB_USER:-baroon}
      DB_PASS: ${DB_PASS:?Isi DB_PASS di file .env}
      APP_DEBUG: ${APP_DEBUG:-false}
    volumes:
      - uploads:/var/www/html/uploads/reptiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-baroon_reptile}
      MARIADB_USER: ${DB_USER:-baroon}
      MARIADB_PASSWORD: ${DB_PASS:?Isi DB_PASS di file .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
      # Dijalankan otomatis sekali, saat volume database masih kosong
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  uploads:
